# Contenuti della pagina iniziale. Il testo può contenere semplice HTML (<b>, <br>).
apertura:
  occhiello: La storia del gioco di carte Pokémon, dal 1999 al 2006
  titolo: Storia<br>del GCC
  testo: 'Come è cambiato il modo di giocare dal Set Base del 1999 ai Mondiali del 2006: set per set, mazzo per mazzo, con le liste dei tornei e la scheda di ogni carta.'
  inizio: '1999'
  fine: '2006'
in_evidenza:
  etichetta: Nuovo
  titolo: I mazzi iconici, dal 1999 al 2006
  testo: '{n} schede: come funziona ogni mazzo, la lista spiegata, i punti deboli, i matchup e le varianti.'
  pagina: mazzi
costanti:
- '<b>La pescata decide quasi tutto.</b> Professor Oak nel 1999, Professor Elm nel 2001, Copycat nel 2002, Steven''s Advice e Rocket''s Admin. nell''era EX: ogni era ha la sua carta di pesca dominante.'
- '<b>Proteggere i primi turni.</b> I Baby della serie Neo, Dunsparce e Rare Candy nell''era EX: le Fase 2 vincono solo se arrivano in campo.'
- '<b>Il controllo cambia forma.</b> Energy Removal, Dark Vileplume, Noc Lock, Desert Ruins, Battle Frontier, Disconnect: il gioco premia chi toglie opzioni all''avversario.'
sottotitolo_ere: Otto formati, otto modi di vincere. Ogni era rimanda all'analisi completa.
nota_campioni: I primi Campionati del Mondo del gioco di carte si giocano nel 2004.
